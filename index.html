<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓語遊戲化核心學習系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); padding: 30px; position: relative; }
        
        /* 頂部資訊列 */
        .user-meta-bar { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; background: #e0e7ff; padding: 10px 15px; border-radius: 10px; margin-bottom: 15px; color: var(--primary-hover); font-weight: 600; }
        .mode-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; color: #fff; font-weight: bold; }
        .mode-practice { background: var(--success); }
        .mode-challenge { background: var(--danger); }

        /* 導覽列 */
        .header { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px; }
        .top-row { display: flex; justify-content: space-between; align-items: center; }
        .unit-selector { display: flex; align-items: center; gap: 8px; cursor: pointer; background: #f3f4f6; padding: 6px 14px; border-radius: 8px; font-weight: bold; }
        .stages-indicator { display: flex; gap: 8px; }
        .stage-dot { padding: 6px 12px; background: #e5e7eb; border-radius: 20px; font-size: 0.8rem; font-weight: bold; color: #6b7280; transition: all 0.3s; cursor: pointer; }
        .stage-dot.active { background: var(--primary); color: #fff; }
        .stage-dot.locked { opacity: 0.4; cursor: not-allowed; }

        /* 進度條與特殊計量器 */
        .progress-bar-container { width: 100%; background: #e5e7eb; height: 10px; border-radius: 5px; margin-bottom: 20px; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.3s ease; }
        .hp-container { display: flex; gap: 5px; font-size: 1.3rem; color: var(--danger); }
        .timer-countdown { font-size: 1.2rem; font-weight: bold; color: var(--danger); display: flex; align-items: center; gap: 5px; }

        /* 核心卡片區 */
        .card-content { text-align: center; min-height: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 25px; min-height: 180px; }
        .combo-badge { background: linear-gradient(45deg, #f59e0b, #ef4444); color: white; padding: 4px 15px; border-radius: 50px; font-weight: bold; font-size: 1rem; margin-bottom: 10px; animation: bounce 0.5s ease; }
        .target-display { font-size: 2.2rem; font-weight: 700; color: #111827; margin-bottom: 15px; word-break: break-all; }
        
        /* 選擇題選項 */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 10px; }
        .option-btn { background: #f9fafb; border: 2px solid #e5e7eb; padding: 14px; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; text-align: center; transition: all 0.2s; }
        .option-btn:hover { background: #f3f4f6; border-color: #cbd5e1; }
        
        /* 智慧錯題與提示 */
        .hint-box { background: #fee2e2; border-left: 4px solid var(--danger); color: #b91c1c; padding: 12px; border-radius: 8px; font-weight: 600; margin-top: 15px; text-align: left; width: 100%; }
        .hint-btn-trigger { background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; font-size: 0.95rem; text-decoration: underline; margin-top: 5px; }

        /* 底部控制 */
        .status-msg { margin-top: 15px; font-weight: bold; text-align: center; min-height: 24px; }
        .listening-active { color: var(--primary); animation: pulse 1.5s infinite; }
        .btn-action-row { display: flex; gap: 10px; width: 100%; margin-top: 15px; }

        button.base-btn { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: #e5e7eb; color: #4b5563; }
        
        /* 模態視窗 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-bottom: 15px; color: var(--primary); font-size: 1.4rem; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem; }
        
        /* 排行榜分頁 */
        .rank-tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid #f3f4f6; padding-bottom: 8px; }
        .rank-tab { flex: 1; padding: 8px 4px; font-size: 0.85rem; font-weight: bold; border: none; background: #e5e7eb; border-radius: 6px; cursor: pointer; }
        .rank-tab.active { background: var(--primary); color: white; }
        .rank-list { text-align: left; max-height: 240px; overflow-y: auto; margin-bottom: 15px; }
        .rank-item { display: flex; justify-content: space-between; padding: 10px 8px; border-bottom: 1px solid #f3f4f6; font-size: 0.95rem; }

        .hidden { display: none !important; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    </style>
</head>
<body>

    <!-- 1. 登入視窗 -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-gamepad"></i> 韓語學習大冒險</h3>
            <p style="font-size: 0.9rem; color:#6b7280; margin-bottom: 15px;">輸入姓名登入，系統將為你載入連續登入天數與進度</p>
            <input type="text" id="username-input" placeholder="請輸入名字/學號 (不可重複)" required />
            <button class="base-btn btn-primary" id="btn-login">進入系統</button>
        </div>
    </div>

    <!-- 2. 排行榜視窗 (全公開、三分頁) -->
    <div class="modal hidden" id="rank-modal">
        <div class="modal-content">
            <h3><i class="fa-solid fa-trophy" style="color: #f59e0b;"></i> 全球榮譽排行榜</h3>
            <div class="rank-tabs">
                <button class="rank-tab active" data-type="word">單字勤奮榜</button>
                <button class="rank-tab" data-type="grammar">語法大師榜</button>
                <button class="rank-tab" data-type="challenge">句型挑戰榜</button>
            </div>
            <div class="rank-list" id="rank-list-content">
                <!-- 動態載入 -->
            </div>
            <button class="base-btn btn-secondary" id="btn-close-rank">關閉</button>
        </div>
    </div>

    <!-- 3. 主學習畫面 -->
    <div class="container hidden" id="main-app">
        <!-- 頂部資訊列 -->
        <div class="user-meta-bar">
            <span><i class="fa-solid fa-user"></i> <span id="lbl-username">學生</span> (🔥<span id="lbl-login-days">1</span>天)</span>
            <span>🪙 XP: <span id="lbl-xp">0</span></span>
            <span id="btn-trigger-rank" style="cursor:pointer; color:var(--warning)"><i class="fa-solid fa-crown"></i> 排行榜</span>
        </div>

        <!-- 關卡導覽 -->
        <div class="header">
            <div class="top-row">
                <div class="unit-selector" id="btn-unit-select">
                    <span id="lbl-unit-title">單元 1</span>
                    <i class="fa-solid fa-chevron-down" style="font-size:0.75rem;"></i>
                </div>
                <div class="stages-indicator">
                    <span class="stage-dot" id="dot-s1" data-stage="1">階段 1: 單字</span>
                    <span class="stage-dot" id="dot-s2" data-stage="2">階段 2: 語法</span>
                    <span class="stage-dot" id="dot-s3" data-stage="3">階段 3: 挑戰</span>
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span id="lbl-mode-text" class="mode-badge mode-practice">練習模式</span>
                <div class="hp-container hidden" id="hp-box"></div>
                <div class="timer-countdown hidden" id="timer-box"><i class="fa-solid fa-clock"></i> <span id="lbl-timer">10</span>s</div>
            </div>
        </div>

        <!-- 進度條 -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="main-progress"></div>
        </div>

        <!-- 核心互動區卡片 -->
        <div class="card-content">
            <div class="combo-badge hidden" id="combo-box">5 Combo 🔥</div>
            <div class="target-display" id="lbl-target-text">안녕하세요</div>
            
            <button class="hint-btn-trigger" id="btn-hint-toggle"><i class="fa-solid fa-lightbulb"></i> 點選提示卡</button>
            <div class="hint-box hidden" id="hint-text-box">提示內容</div>

            <!-- 多選一按鈕群 -->
            <div class="options-grid hidden" id="quiz-options-container"></div>

            <!-- 跟讀與狀態文字區 -->
            <div class="status-msg" id="lbl-status-text"></div>
        </div>

        <!-- 功能底列 -->
        <div class="btn-action-row">
            <button class="base-btn btn-secondary" id="btn-tts"><i class="fa-solid fa-volume-high"></i> 發音導讀</button>
            <button class="base-btn btn-success hidden" id="btn-forced-mic"><i class="fa-solid fa-microphone"></i> 點擊麥克風跟讀</button>
        </div>
    </div>

    <script src="words.js"></script>
    <script>
        /*************************************************************
         * 1. 全域變數與遊戲化核心狀態
         *************************************************************/
        const DB_KEY = "KR_GAME_SYSTEM_2026";
        let db = {}; // 全體學生資料
        let user = ""; // 當前登入學生姓名
        
        // 核心計分與挑戰數據結構
        let userScores = {
            xp: 0,
            loginDays: 1,
            maxUnlockedUnit: 1,
            maxUnlockedStage: 1,
            wordScores: 0,       // 階段 1 排行榜分數
            grammarScores: 0,    // 階段 2 排行榜分數
            challengeScores: 0,  // 階段 3 排行榜分數
            wordStreaks: {},     // 紀錄每個單字連續答對次數 {"짐": 2}
            wrongWordsBuffer: [] // 智慧錯題緩衝池 (4題後重現)
        };

        let currentUnit = 1;
        let currentStage = 1; // 1:單字練習, 2:語法練習, 3:句型挑戰
        let currentQueue = [];
        let currentIndex = 0;
        let comboCount = 0;
        let hp = 3;
        
        // 計時器與安全控制快照
        let stage3Timer = null;
        let currentStage3TimeLeft = 10;
        let micSafetyTimer = null; // 25秒過期用
        let isWrongAnsweringState = false; // 是否正處於「答錯跟讀」鎖定狀態

        /*************************************************************
         * 2. 資料庫初始化與學生登入
         *************************************************************/
        function initSystem() {
            const saved = localStorage.getItem(DB_KEY);
            if (saved) db = JSON.parse(saved);
        }
        initSystem();

        document.getElementById("btn-login").addEventListener("click", () => {
            const nameInput = document.getElementById("username-input").value.trim();
            if(!nameInput) { alert("請輸入有效的名字！"); return; }
            
            user = nameInput;
            if(!db[user]) {
                // 新增使用者，隨機模擬產生 1-5 天連續登入加成
                let simulatedLogin = Math.floor(Math.random() * 5) + 1;
                db[user] = {
                    xp: 0, loginDays: simulatedLogin, maxUnlockedUnit: 1, maxUnlockedStage: 1,
                    wordScores: 0, grammarScores: 0, challengeScores: 0,
                    wordStreaks: {}, wrongWordsBuffer: []
                };
                saveToStorage();
            }
            
            userScores = db[user];
            // 進入系統介面
            document.getElementById("login-modal").classList.add("hidden");
            document.getElementById("main-app").classList.remove("hidden");
            
            // 更新畫面上方標籤
            document.getElementById("lbl-username").innerText = user;
            document.getElementById("lbl-login-days").innerText = userScores.loginDays;
            updateXPDisplay();

            // 啟動瀏覽器分頁切換監聽 (防呆：跳出畫面立刻停止麥克風)
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) { stopSpeechRecognition(); }
            });

            loadStage(userScores.maxUnlockedUnit, userScores.maxUnlockedStage);
        });

        function saveToStorage() {
            if(user) db[user] = userScores;
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }

        function updateXPDisplay() {
            document.getElementById("lbl-xp").innerText = userScores.xp;
        }

        /*************************************************************
         * 3. 排行榜邏輯 (公開透明、三分頁)
         *************************************************************/
        const rankModal = document.getElementById("rank-modal");
        let activeRankTab = "word";

        document.getElementById("btn-trigger-rank").addEventListener("click", () => {
            renderRankList();
            rankModal.classList.remove("hidden");
        });

        document.getElementById("btn-close-rank").addEventListener("click", () => {
            rankModal.classList.add("hidden");
        });

        document.querySelectorAll(".rank-tab").forEach(tab => {
            tab.addEventListener("click", (e) => {
                document.querySelectorAll(".rank-tab").forEach(t => t.classList.remove("active"));
                e.target.classList.add("active");
                activeRankTab = e.target.getAttribute("data-type");
                renderRankList();
            });
        });

        function renderRankList() {
            const listContainer = document.getElementById("rank-list-content");
            listContainer.innerHTML = "";
            
            // 抓取全體學生
            let players = Object.keys(db).map(name => {
                return {
                    name: name,
                    word: db[name].wordScores || 0,
                    grammar: db[name].grammarScores || 0,
                    challenge: db[name].challengeScores || 0
                }
            });

            // 依據當前選定的分頁類型進行排序
            players.sort((a, b) => b[activeRankTab] - a[activeRankTab]);

            players.forEach((p, idx) => {
                let crown = "";
                if (idx === 0) crown = "🥇 ";
                else if (idx === 1) crown = "🥈 ";
                else if (idx === 2) crown = "🥉 ";

                let scoreSuffix = " XP";
                let displayScore = p[activeRankTab];
                if(activeRankTab === 'grammar') scoreSuffix = " 積分";
                if(activeRankTab === 'challenge') scoreSuffix = " 挑戰分";

                const row = document.createElement("div");
                row.className = "rank-item";
                row.innerHTML = `<span>${crown}${idx + 1}. ${p.name}</span><span>${displayScore}${scoreSuffix}</span>`;
                listContainer.appendChild(row);
            });
        }

        /*************************************************************
         * 4. 階段流程排程與題目佇列配給
         *************************************************************/
        function loadStage(unit, stage) {
            // 清理定時器
            clearInterval(stage3Timer);
            stopSpeechRecognition();
            isWrongAnsweringState = false;

            currentUnit = unit;
            currentStage = stage;
            currentIndex = 0;
            
            document.getElementById("lbl-unit-title").innerText = `單元 ${currentUnit}`;
            document.getElementById("hint-text-box").classList.add("hidden");
            document.getElementById("btn-forced-mic").classList.add("hidden");

            // 頂部導航小圓點高亮與防跳關機制
            document.querySelectorAll(".stage-dot").forEach(dot => {
                const sNum = parseInt(dot.getAttribute("data-stage"));
                dot.className = "stage-dot";
                
                if(sNum === currentStage) dot.classList.add("active");
                
                // 防跳關權限控制
                if(currentUnit > userScores.maxUnlockedUnit || (currentUnit === userScores.maxUnlockedUnit && sNum > userScores.maxUnlockedStage)) {
                    dot.classList.add("locked");
                }
            });

            // 模式屬性初始化切換
            const modeBadge = document.getElementById("lbl-mode-text");
            const hpBox = document.getElementById("hp-box");
            const timerBox = document.getElementById("timer-box");

            if(currentStage === 3) {
                modeBadge.innerText = "挑戰模式";
                modeBadge.className = "mode-badge mode-challenge";
                hpBox.classList.remove("hidden");
                timerBox.classList.remove("hidden");
                hp = 3;
                renderHP();
            } else {
                modeBadge.innerText = "練習模式";
                modeBadge.className = "mode-badge mode-practice";
                hpBox.classList.add("hidden");
                timerBox.classList.add("hidden");
                comboCount = 0;
                document.getElementById("combo-box").classList.add("hidden");
            }

            // 動態組件生成
            buildQueue();
            showCurrentQuestion();
        }

        // 綁定上排標籤點選事件
        document.querySelectorAll(".stage-dot").forEach(dot => {
            dot.addEventListener("click", () => {
                const targetS = parseInt(dot.getAttribute("data-stage"));
                if(currentUnit > userScores.maxUnlockedUnit || (currentUnit === userScores.maxUnlockedUnit && targetS > userScores.maxUnlockedStage)) {
                    alert("🔒 此階段尚未解鎖，請先依序完成前面的修煉！");
                    return;
                }
                loadStage(currentUnit, targetS);
            });
        });

        // 點點單元選單切換
        document.getElementById("btn-unit-select").addEventListener("click", () => {
            let req = prompt(`請輸入你想前往的單元 (1 到 ${userScores.maxUnlockedUnit})`, currentUnit);
            req = parseInt(req);
            if(req >= 1 && req <= userScores.maxUnlockedUnit) {
                loadStage(req, 1);
            } else if (req > userScores.maxUnlockedUnit) {
                alert("🔒 該大單元尚未解鎖！");
            }
        });

        function buildQueue() {
            // 從全域 words.js 撈取資料
            if(typeof generateDatabase === "function" && (!window.globalWordsPool || window.globalWordsPool.length === 0)){
                window.globalWordsPool = generateDatabase();
            }
            let pool = window.globalWordsPool || [];

            if(currentStage === 1) {
                // 階段 1：單字練習（無限練習，每次配10個）
                let rawWords = pool.filter(x => x.unit === currentUnit && x.type === 'word');
                currentQueue = shuffleArray([...rawWords]);
            } else if (currentStage === 2) {
                // 階段 2：語法練習 練滿 25 題固定門檻
                let rawSentences = pool.filter(x => x.unit === currentUnit && x.type === 'sentence');
                let temp = [];
                while(temp.length < 25) {
                    temp = temp.concat(shuffleArray([...rawSentences]));
                }
                currentQueue = temp.slice(0, 25);
            } else {
                // 階段 3：大魔王挑戰
                let rawSentences = pool.filter(x => x.unit === currentUnit && x.type === 'sentence');
                currentQueue = shuffleArray([...rawSentences]).slice(0, 5); // 精選5題快速對決
            }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function renderHP() {
            const hpBox = document.getElementById("hp-box");
            hpBox.innerHTML = "";
            for(let i=0; i<3; i++) {
                const heart = document.createElement("i");
                heart.className = (i < hp) ? "fa-solid fa-heart" : "fa-regular fa-heart";
                hpBox.appendChild(heart);
            }
        }

        /*************************************************************
         * 5. 核心出題與互動渲染
         *************************************************************/
        function showCurrentQuestion() {
            if(currentIndex >= currentQueue.length) {
                handleStageComplete();
                return;
            }

            // 重置基本狀態
            isWrongAnsweringState = false;
            document.getElementById("hint-text-box").classList.add("hidden");
            document.getElementById("btn-forced-mic").classList.add("hidden");
            document.getElementById("lbl-status-text").innerText = "";
            document.getElementById("lbl-status-text").className = "status-msg";
            
            // 計算總進度條比例
            let pct = (currentIndex / currentQueue.length) * 100;
            document.getElementById("main-progress").style.width = `${pct}%`;

            const item = currentQueue[currentIndex];

            if(currentStage === 1) {
                // 【階段 1 畫面設計】
                document.getElementById("quiz-options-container").classList.remove("hidden");
                // 題目秀出韓語單字
                document.getElementById("lbl-target-text").innerText = item.text;
                buildOptions(item);
            } 
            else if(currentStage === 2) {
                // 【階段 2 畫面設計】句型挖空只留單字選
                document.getElementById("quiz-options-container").classList.remove("hidden");
                
                // 進行句型包裝處理
                let sentencePattern = item.text; // 範例: "시계가 있어요" 
                let coreWord = findCoreWord(sentencePattern); // 從字典反查基礎核心單字，如 "시계"
                
                // 畫面上隱藏單字轉為底線：變成 "____가 있어요"
                let displayPattern = sentencePattern.replace(coreWord, "______");
                document.getElementById("lbl-target-text").innerText = displayPattern;
                
                buildOptionsForGrammar(coreWord, item);
            } 
            else if(currentStage === 3) {
                // 【階段 3 挑戰模式】
                document.getElementById("quiz-options-container").classList.remove("hidden");
                let sentencePattern = item.text;
                let coreWord = findCoreWord(sentencePattern);
                let displayPattern = sentencePattern.replace(coreWord, "______");
                document.getElementById("lbl-target-text").innerText = displayPattern;

                buildOptionsForGrammar(coreWord, item);
                startStage3Timer();
            }
        }

        function findCoreWord(sentence) {
            // 自動尋找對照組字典
            const wordList = ["짐", "볼펜", "담요", "휴地", "휴지", "시계", "지우개", "컴퓨터", "라면", "콜라", "지갑", "커피", "메뉴", "우산", "손님", "정장", "맥주", "잡지", "여권", "핸드폰", "옷", "반찬", "홍차", "빵"];
            for(let w of wordList) {
                if(sentence.includes(w)) return w;
            }
            return sentence.substring(0, 2); // 備用防呆截取
        }

        // 產生階段 1 的選項 (中文意思多選一)
        function buildOptions(correctItem) {
            const container = document.getElementById("quiz-options-container");
            container.innerHTML = "";

            let answers = [correctItem];
            let pool = window.globalWordsPool.filter(x => x.type === 'word' && x.text !== correctItem.text);
            shuffleArray(pool);
            
            // 抓兩個當作干擾項
            for(let i=0; i<3; i++) {
                if(pool[i]) answers.push(pool[i]);
            }
            answers = shuffleArray(answers).slice(0, 4);

            answers.forEach(ans => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = getChineseHintString(ans);
                btn.addEventListener("click", () => handleAnswerSelect(ans.text === correctItem.text));
                container.appendChild(btn);
            });
        }

        // 產生階段 2 & 3 的選項 (純韓語單字多選一，考驗收音與語法搭配)
        function buildOptionsForGrammar(coreWord, fullItem) {
            const container = document.getElementById("quiz-options-container");
            container.innerHTML = "";

            let answers = [coreWord];
            const wordList = ["짐", "볼펜", "담요", "휴지", "시계", "지우개", "컴퓨器", "라면", "콜라", "지갑", "우산", "맥주", "빵"];
            let distractors = wordList.filter(x => x !== coreWord);
            shuffleArray(distractors);

            answers.push(distractors[0]);
            answers.push(distractors[1]);
            answers.push(distractors[2]);
            answers = shuffleArray(answers);

            answers.forEach(word => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = word;
                btn.addEventListener("click", () => {
                    if(currentStage === 3) clearInterval(stage3Timer);
                    handleAnswerSelect(word === coreWord);
                });
                container.appendChild(btn);
            });
        }

        /*************************************************************
         * 6. 核心得分與智慧錯題判定邏輯
         *************************************************************/
        function handleAnswerSelect(isCorrect) {
            if(isWrongAnsweringState) return; // 鎖定中不可重複點選選項

            const currentItem = currentQueue[currentIndex];

            if(isCorrect) {
                // --- 【答對了】 ---
                playTTS(currentItem.text);
                
                if(currentStage === 1) {
                    // 基礎 1 XP 乘上登入加成
                    let bonusMultiplier = Math.min(1 + (userScores.loginDays * 0.1), 1.5);
                    let earnedXP = Math.round(1 * bonusMultiplier);
                    
                    userScores.xp += earnedXP;
                    userScores.wordScores += earnedXP;
                    
                    // 連對次數判定
                    if(!userScores.wordStreaks[currentItem.text]) userScores.wordStreaks[currentItem.text] = 0;
                    userScores.wordStreaks[currentItem.text]++;

                    document.getElementById("lbl-status-text").innerHTML = `<span style="color:var(--success)">🥇 答對了！+${earnedXP} XP (熟練度: ${userScores.wordStreaks[currentItem.text]}/3)</span>`;
                } 
                else if(currentStage === 2) {
                    comboCount++;
                    let baseXP = 1;
                    if(comboCount >= 5) {
                        baseXP = baseXP * 2; // 連擊5題後積分加倍
                        document.getElementById("combo-box").innerText = `${comboCount} Combo 🔥 加倍中`;
                        document.getElementById("combo-box").classList.remove("hidden");
                    }
                    let bonusMultiplier = Math.min(1 + (userScores.loginDays * 0.1), 1.5);
                    let finalGrammarScore = Math.round(baseXP * bonusMultiplier);
                    
                    userScores.xp += finalGrammarScore;
                    userScores.grammarScores += finalGrammarScore;

                    document.getElementById("lbl-status-text").innerHTML = `<span style="color:var(--success)">🔥 連擊答對！Combo +${comboCount} (獲得 ${finalGrammarScore} 積分)</span>`;
                }
                else if(currentStage === 3) {
                    // 挑戰模式計分公式：[10 XP + 剩餘秒數] * Combo
                    comboCount++;
                    let speedBonus = currentStage3TimeLeft;
                    let roundScore = (10 + speedBonus) * (comboCount >= 3 ? 1.5 : 1);
                    roundScore = Math.round(roundScore);

                    userScores.xp += roundScore;
                    userScores.challengeScores += roundScore;

                    document.getElementById("lbl-status-text").innerHTML = `<span style="color:var(--success)">💎 挑戰成功！+${roundScore} 挑戰分</span>`;
                }

                saveToStorage();
                updateXPDisplay();

                setTimeout(() => {
                    currentIndex++;
                    showCurrentQuestion();
                }, 1300);

            } else {
                // --- 【答錯了】 ---
                comboCount = 0; // Combo 歸零
                document.getElementById("combo-box").classList.add("hidden");

                if(currentStage === 1) {
                    // 單字練習連對紀錄歸零
                    userScores.wordStreaks[currentItem.text] = 0;
                    saveToStorage();

                    // 智慧錯題：注入緩衝池，排在 4 題之後重現
                    injectWrongItemIntoQueue(currentItem);

                    // 觸發修正對話：顯示提示詞引導跟讀
                    triggerWrongCorrectionFlow(currentItem);
                } 
                else if(currentStage === 2) {
                    // 語法練習答錯：智慧錯題排在 4 題之後重現
                    injectWrongItemIntoQueue(currentItem);
                    triggerWrongCorrectionFlow(currentItem);
                }
                else if(currentStage === 3) {
                    // 挑戰模式答錯：扣除生命值
                    hp--;
                    renderHP();
                    if(hp <= 0) {
                        alert("💀 心心歸零！Game Over 挑戰失敗，必須返回練習模式重新修煉！");
                        loadStage(currentUnit, 2); // 降級回階段2
                    } else {
                        document.getElementById("lbl-status-text").innerHTML = `<span style="color:var(--danger)">❌ 答錯了，扣除一顆心！</span>`;
                        setTimeout(() => {
                            currentIndex++;
                            showCurrentQuestion();
                        }, 1300);
                    }
                }
            }
        }

        // 智慧錯題在 4 題後重現核心演算
        function injectWrongItemIntoQueue(item) {
            let targetPos = currentIndex + 5; // 當前指標 + 5 (即中間隔了 4 題)
            if(targetPos > currentQueue.length) {
                currentQueue.push(item); // 超出長度直接塞到尾端
            } else {
                currentQueue.splice(targetPos, 0, item);
            }
        }

        // 觸發「答錯跟讀強制導正」流程
        function triggerWrongCorrectionFlow(item) {
            isWrongAnsweringState = true;
            
            // 彈出正解與智慧文法提示框
            const hintBox = document.getElementById("hint-text-box");
            let hasPatch = item.text.includes("이 있어요") || item.text.includes("은") || item.text.includes("이 없어요");
            let patchTips = hasPatch ? "【文法提示：前字有收音，請搭配 이 / 은】" : "【文法提示：前字無收音，請搭配 가 / 는】";
            if(item.type === 'word') patchTips = "【字根記憶強化】";

            hintBox.innerHTML = `<strong>⚠️ 正解：${item.text}</strong><br>${patchTips}<br>💡 中文義：${getChineseHintString(item)}`;
            hintBox.classList.remove("hidden");

            document.getElementById("lbl-status-text").innerHTML = `<span style="color:var(--danger)">答錯了！請點擊下方麥克風完成正確跟讀，導正發音才能前進下一題。</span>`;
            
            // 秀出跟讀按鈕
            const micBtn = document.getElementById("btn-forced-mic");
            micBtn.classList.remove("hidden");

            // 啟動 25 秒防呆與安全節流計時器
            clearTimeout(micSafetyTimer);
            micSafetyTimer = setTimeout(() => {
                alert("⏰ 停留時間超過 25 秒，系統已自動重置並釋放語音元件。");
                stopSpeechRecognition();
                // 強制放行進入下一題，減輕卡關焦慮
                isWrongAnsweringState = false;
                currentIndex++;
                showCurrentQuestion();
            }, 25000);
        }

        /*************************************************************
         * 7. 倒數計時與關卡完成清算
         *************************************************************/
        function startStage3Timer() {
            currentStage3TimeLeft = 10;
            document.getElementById("lbl-timer").innerText = currentStage3TimeLeft;
            clearInterval(stage3Timer);
            
            stage3Timer = setInterval(() => {
                currentStage3TimeLeft--;
                document.getElementById("lbl-timer").innerText = currentStage3TimeLeft;
                if(currentStage3TimeLeft <= 0) {
                    clearInterval(stage3Timer);
                    // 時間到視同答錯
                    handleAnswerSelect(false);
                }
            }, 1000);
        }

        function handleStageComplete() {
            if(currentStage === 1) {
                // 檢查是否所有本單元單字都連對 3 次
                let pool = (window.globalWordsPool || []).filter(x => x.unit === currentUnit && x.type === 'word');
                let allPerfect = pool.every(x => (userScores.wordStreaks[x.text] >= 3));

                if(allPerfect) {
                    alert("🎉 恭喜！本單元所有單字皆已達成連續 3 次答對的 100% 熟練度！順利晉級【階段 2：語法練習】。");
                    userScores.maxUnlockedStage = 2;
                    saveToStorage();
                    loadStage(currentUnit, 2);
                } else {
                    const retry = confirm("💡 單字佇列完成！但仍有單字未滿「連續答對 3 次」的熟練門檻。\n\n【確定】：點選確定留在本關，系統為你重新洗牌與強化錯題練習。\n【取消】：回看進度。");
                    buildQueue();
                    currentIndex = 0;
                    showCurrentQuestion();
                }
            } 
            else if(currentStage === 2) {
                // 階段 2：正確率總結驗算
                alert("🎉 階段 2 練滿 25 題總驗收！你的實力已穩固累積，現在正式為你解鎖【階段 3：限時挑戰魔王關】！");
                userScores.maxUnlockedStage = 3;
                saveToStorage();
                loadStage(currentUnit, 3);
            } 
            else if(currentStage === 3) {
                // 階段 3 挑戰模式過關 -> 解鎖全新大單元！
                alert(`🏆 榮耀時刻！你成功在生命值歸零前通過了單元 ${currentUnit} 的大魔王驗收！全新的【單元 ${currentUnit + 1}】文法核心已為你全面敞開！`);
                userScores.maxUnlockedUnit = currentUnit + 1;
                userScores.maxUnlockedStage = 1;
                saveToStorage();
                loadStage(currentUnit + 1, 1);
            }
        }

        /*************************************************************
         * 8. 語音合成(TTS)與辨識(SpeechRecognition)
         *************************************************************/
        function playTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'ko-KR';
                window.speechSynthesis.speak(u);
            }
        }

        document.getElementById("btn-tts").addEventListener("click", () => {
            const item = currentQueue[currentIndex];
            if(item) playTTS(item.text);
        });

        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.continuous = false;
        }

        const micBtn = document.getElementById("btn-forced-mic");
        micBtn.addEventListener("click", () => {
            if(!recognition) { alert("此瀏覽器不支援語音辨識，請使用 Chrome 瀏覽器。"); return; }
            document.getElementById("lbl-status-text").className = "status-msg listening-active";
            document.getElementById("lbl-status-text").innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 麥克風收音中...請大聲精確讀出正解韓文...`;
            recognition.start();
        });

        if(recognition) {
            recognition.onresult = function(event) {
                const speechResult = event.results[0][0].transcript.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?\s]/g, "").toLowerCase();
                const currentItem = currentQueue[currentIndex];
                const targetClean = currentItem.text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?\s]/g, "").toLowerCase();

                if(speechResult === targetClean || targetClean.includes(speechResult) || speechResult.includes(targetClean)) {
                    clearTimeout(micSafetyTimer); // 成功即重置關閉計時器
                    document.getElementById("lbl-status-text").className = "status-msg";
                    document.getElementById("lbl-status-text").innerHTML = `<span style="color:var(--success)">   跟讀導正成功！辨識結果："${event.results[0][0].transcript}"</span>`;
                    
                    setTimeout(() => {
                        isWrongAnsweringState = false;
                        currentIndex++;
                        showCurrentQuestion();
                    }, 1500);
                } else {
                    document.getElementById("lbl-status-text").innerHTML = `<span style="color:var(--danger)">❌ 讀音差距較大（偵測到："${event.results[0][0].transcript}"），請再次嘗試按麥克風精準跟讀。</span>`;
                }
            };

            recognition.onerror = function() {
                document.getElementById("lbl-status-text").className = "status-msg";
                document.getElementById("lbl-status-text").innerText = "🎤 辨識未成功捕捉，請重新再試。";
            };
        }

        function stopSpeechRecognition() {
            if(recognition) {
                try { recognition.stop(); } catch(e){}
            }
            document.getElementById("lbl-status-text").className = "status-msg";
        }

        // 靜態翻譯包對照
        function getChineseHintString(item) {
            if(item.chinese) return item.chinese;
            const dict = {
                "짐":"行李", "볼펜":"原子筆", "담요":"毛毯", "휴지":"衛生紙", "시계":"時鐘/手錶",
                "지우개":"橡皮擦", "컴퓨터":"電腦", "라면":"泡麵", "콜라":"可樂", "지갑":"皮夾",
                "커피":"咖啡", "메뉴":"菜單", "우산":"雨傘", "손님":"客人", "정장":"西裝", "맥주":"啤酒", "잡지":"雜誌", "여권":"護照", "핸드폰":"手機", "옷":"衣服", "반찬":"小菜", "홍차":"紅茶", "빵":"麵包"
            };
            return dict[item.text] || "核心字彙";
        }

        // 提示卡隱藏切換
        document.getElementById("btn-hint-toggle").addEventListener("click", (e) => {
            e.stopPropagation();
            const box = document.getElementById("hint-text-box");
            if(box.classList.contains("hidden")) {
                const currentItem = currentQueue[currentIndex];
                box.innerHTML = `💡 中文意思：${getChineseHintString(currentItem)}`;
                box.classList.remove("hidden");
            } else {
                box.classList.add("hidden");
            }
        });

        document.addEventListener("click", (e) => {
            if(e.target.id !== "btn-hint-toggle") {
                document.getElementById("hint-text-box").classList.add("hidden");
            }
        });
    </script>
</body>

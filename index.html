<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韓語開口練習</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary:#4f46e5; --primary-hover:#4338ca; --success:#10b981; --danger:#ef4444;
    --warning:#f59e0b; --bg:#f3f4f6; --card-bg:#ffffff; --text:#1f2937;
  }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', system-ui, sans-serif; }
  body { background:var(--bg); color:var(--text); padding:20px; display:flex; justify-content:center; min-height:100vh; }
  .container { width:100%; max-width:650px; background:var(--card-bg); border-radius:20px; box-shadow:0 15px 35px rgba(0,0,0,.08); padding:30px; }
  .user-meta-bar { display:flex; justify-content:space-between; align-items:center; font-size:.9rem; background:#e0e7ff; padding:10px 15px; border-radius:10px; margin-bottom:15px; color:var(--primary-hover); font-weight:600; flex-wrap:wrap; gap:6px; }
  .mode-badge { padding:4px 10px; border-radius:20px; font-size:.8rem; color:#fff; font-weight:bold; }
  .mode-vocab { background:#6366f1; }
  .mode-grammar { background:#0ea5e9; }
  .mode-dialogue { background:var(--warning); }
  .header { display:flex; flex-direction:column; gap:15px; margin-bottom:20px; border-bottom:2px solid #f3f4f6; padding-bottom:15px; }
  .top-row { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
  .stages-indicator { display:flex; gap:8px; }
  .stage-dot { padding:6px 12px; background:#e5e7eb; border-radius:20px; font-size:.8rem; font-weight:bold; color:#6b7280; cursor:pointer; transition:.2s; }
  .stage-dot.active { background:var(--primary); color:#fff; }
  .progress-bar-container { width:100%; background:#e5e7eb; height:10px; border-radius:5px; margin-bottom:20px; overflow:hidden; }
  .progress-bar { height:100%; background:var(--success); width:0%; transition:width .3s ease; }
  .hearts { display:flex; gap:4px; font-size:1.1rem; color:var(--danger); }
  .card-content { text-align:center; display:flex; flex-direction:column; align-items:center; margin-bottom:20px; min-height:220px; }
  .sub-label { font-size:.8rem; color:#9ca3af; margin-bottom:6px; }
  .target-display { font-size:1.5rem; font-weight:700; color:#111827; margin-bottom:15px; white-space:pre-line; }
  .puzzle-zone { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:60px; width:100%; border:2px dashed #cbd5e1; border-radius:12px; padding:10px; margin-bottom:15px; background:#f9fafb; }
  .blocks-pool { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; width:100%; margin-top:10px; }
  .word-block { background:#fff; border:2px solid #6366f1; color:#4338ca; padding:10px 18px; border-radius:10px; font-size:1.05rem; font-weight:bold; cursor:pointer; user-select:none; transition:.15s; }
  .word-block:hover { background:#eef2ff; transform:translateY(-2px); }
  .word-block.used { opacity:.35; cursor:not-allowed; background:#e2e8f0; border-color:#cbd5e1; color:#94a3b8; }
  .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; margin-top:6px; }
  .option-btn { background:#f9fafb; border:2px solid #e5e7eb; padding:14px; border-radius:12px; font-size:1.05rem; font-weight:600; cursor:pointer; }
  .option-btn:hover { border-color:var(--primary); }
  .status-msg-container { width:100%; min-height:52px; margin-top:12px; display:flex; align-items:center; justify-content:center; }
  .status-msg { text-align:center; font-size:1.05rem; width:100%; }
  .listening-active { color:var(--danger); animation:pulse 1.2s infinite; background:#ffe4e6; padding:8px; border-radius:8px; display:inline-block; width:100%; }
  .btn-action-row { display:flex; gap:10px; width:100%; margin-top:5px; flex-wrap:wrap; }
  button.base-btn { flex:1; min-width:120px; padding:13px; font-size:1rem; font-weight:bold; border-radius:10px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-success { background:var(--success); color:#fff; }
  .btn-secondary { background:#e5e7eb; color:#4b5563; }
  .btn-danger { background:var(--danger); color:#fff; }
  .modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.6); display:flex; justify-content:center; align-items:center; z-index:1000; }
  .modal-content { background:#fff; padding:30px; border-radius:20px; width:90%; max-width:420px; text-align:center; }
  .modal-content input { width:100%; padding:12px; margin-bottom:12px; border:2px solid #e5e7eb; border-radius:8px; font-size:1rem; }
  .fallback-note { font-size:.8rem; color:#9ca3af; margin-top:8px; }
  .hidden { display:none !important; }
  @keyframes pulse { 0%,100%{opacity:.7} 50%{opacity:1} }
</style>

<script>

/*************************************************************
 * 1. 詞彙與語法資料(單元只能用「本單元 + 之前單元」的內容)
 *************************************************************/
const VOCAB = [
  {text:'책',   chinese:'書',   unit:1},
  {text:'펜',   chinese:'筆',   unit:1},
  {text:'가방', chinese:'包包', unit:1},
  {text:'시간', chinese:'時間', unit:1},
  {text:'돈',   chinese:'錢',   unit:1},
  {text:'친구', chinese:'朋友', unit:1},
  {text:'개',   chinese:'個(量詞)', unit:2, isQuantifier:true},
  {text:'명',   chinese:'名(量詞)', unit:2, isQuantifier:true},
  {text:'잔',   chinese:'杯(量詞)', unit:2, isQuantifier:true},
  {text:'권',   chinese:'本(量詞)', unit:2, isQuantifier:true},
  {text:'마리', chinese:'隻(量詞)', unit:2, isQuantifier:true},
  {text:'사과', chinese:'蘋果', unit:2},
  {text:'사람', chinese:'人',   unit:2},
  {text:'고양이', chinese:'貓', unit:2},
  {text:'커피', chinese:'咖啡', unit:2},
  {text:'물',   chinese:'水',   unit:3},
  {text:'메뉴', chinese:'菜單', unit:3},
  {text:'영수증', chinese:'收據', unit:3},
];
// 名詞對應的量詞(單元二文法用)
const QUANTIFIER_OF = { 사과:'개', 사람:'명', 고양이:'마리', 책:'권', 커피:'잔', 메뉴:'권', 영수증:'권' };
const NATIVE_NUM = ["", "하나","둘","셋","넷","다섯","여섯","일곱","여덟","아홉","열",
  "열하나","열둘","열셋","열넷","열다섯","열여섯","열일곱","열여덟","열아홉"];
const NUM_TRANSFORM = { "하나":"한","둘":"두","셋":"세","넷":"네","열하나":"열한","열둘":"열두","열셋":"열세","열넷":"열네" };

const UNIT_META = {
  1: { name:'이/가 있어요 · 없어요', pattern:(w)=> `${w.text}${hasBatchim(w.text)?'이':'가'} 있어요.`, dialogue:[
        {spk:'A', kr:'펜이 있어요?', zh:'你有筆嗎?'}, {spk:'B', kr:'네, 펜이 있어요.', zh:'有,我有筆。'},
        {spk:'A', kr:'가방도 있어요?', zh:'也有包包嗎?'}, {spk:'B', kr:'아니요, 가방이 없어요.', zh:'沒有,我沒有包包。'} ] },
  2: { name:'수량 + 량사 + 있어요', pattern:null, dialogue:[
        {spk:'A', kr:'사과가 몇 개 있어요?', zh:'有幾顆蘋果?'}, {spk:'B', kr:'사과가 세 개 있어요.', zh:'有三顆蘋果。'},
        {spk:'A', kr:'고양이도 있어요?', zh:'也有貓嗎?'}, {spk:'B', kr:'네, 고양이가 한 마리 있어요.', zh:'有,有一隻貓。'} ] },
  3: { name:'N 주세요', pattern:(w)=> `${w.text} 주세요.`, dialogue:[
        {spk:'A', kr:'뭐 드릴까요?', zh:'請問要什麼?'}, {spk:'B', kr:'커피 한 잔 주세요.', zh:'請給我一杯咖啡。'},
        {spk:'A', kr:'네, 여기 있어요.', zh:'好的,在這裡。'}, {spk:'B', kr:'영수증 주세요.', zh:'請給我收據。'} ] },
};

/*************************************************************
 * 2. 共用小工具
 *************************************************************/
function hasBatchim(word){
  if(!word) return false;
  const c = word.charCodeAt(word.length-1);
  if(c < 0xAC00 || c > 0xD7A3) return false;
  return (c - 0xAC00) % 28 !== 0;
}
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function cumulativeVocab(unit){ return VOCAB.filter(w=>w.unit<=unit); }

// 建立單元二/三的完整句子與拼句字塊
function buildSentenceFor(word, unit){
  if(unit === 1){
    const s = `${word.text}${hasBatchim(word.text)?'이':'가'} 있어요.`;
    return { sentence:s, chinese:`有${word.chinese}`, blocks:[word.text, `${hasBatchim(word.text)?'이':'가'} 있어요.`] };
  }
  if(unit === 2){
    const q = QUANTIFIER_OF[word.text] || '개';
    const n = Math.floor(Math.random()*9)+1;
    const numWord = NUM_TRANSFORM[NATIVE_NUM[n]] || NATIVE_NUM[n];
    const qParticle = hasBatchim(q)?'이':'가';
    const s = `${word.text} ${numWord} ${q}${qParticle} 있어요.`;
    return { sentence:s, chinese:`有${n}${q}${word.chinese}`, blocks:[word.text, numWord, q, `${qParticle} 있어요.`] };
  }
  const s = `${word.text} 주세요.`;
  return { sentence:s, chinese:`請給我${word.chinese}`, blocks:[word.text, '주세요.'] };
}

// 字元 bigram 相似度(語音辨識比對用)——功能先求有,失敗時走手動確認
function bigrams(str){ const s=str.replace(/[.,!?\s]/g,''); const arr=[]; for(let i=0;i<s.length-1;i++) arr.push(s.slice(i,i+2)); return arr; }
function similarity(a,b){
  const A=bigrams(a), B=bigrams(b);
  if(A.length===0 || B.length===0) return a.trim()===b.trim() ? 1:0;
  let matches=0; const bCopy=[...B];
  A.forEach(g=>{ const idx=bCopy.indexOf(g); if(idx>-1){ matches++; bCopy.splice(idx,1);} });
  return (2*matches)/(A.length+B.length);
}

/*************************************************************
 * 3. 帳號系統(Supabase Auth,暱稱轉內部 email,密碼由 Supabase 官方處理)
 *************************************************************/
let currentUser = null; // {id, username}
let state = null;       // 進度物件,結構見 defaultState()

function usernameToEmail(u){ return u.trim().toLowerCase().replace(/[^a-z0-9]/g,'') + "@korean-app.local"; }
function defaultState(){
  return { xp:0, streak:1, lastLogin: todayStr(), maxUnlockedUnit:1, wordState:{}, wrongBuffer:[] };
}

document.getElementById("btn-register").addEventListener("click", async () => {
  const uname = document.getElementById("username-input").value.trim();
  const pwd = document.getElementById("password-input").value.trim();
  const statusEl = document.getElementById("auth-status");
  if(uname.length < 3 || pwd.length < 6){ statusEl.textContent = "暱稱至少3碼、密碼至少6碼"; return; }
  if(!db){ statusEl.textContent = "尚未設定 Supabase,請見說明步驟"; return; }
  statusEl.textContent = "註冊中...";
  const { data, error } = await db.auth.signUp({
    email: usernameToEmail(uname),
    password: pwd,
    options: { data: { username: uname } }
  });
  if(error){ statusEl.textContent = "註冊失敗:" + error.message; return; }
  statusEl.textContent = "註冊成功,請直接登入";
});

document.getElementById("btn-login").addEventListener("click", async () => {
  const uname = document.getElementById("username-input").value.trim();
  const pwd = document.getElementById("password-input").value.trim();
  const statusEl = document.getElementById("auth-status");
  if(!uname || !pwd){ statusEl.textContent = "請輸入暱稱與密碼"; return; }
  if(!db){ statusEl.textContent = "尚未設定 Supabase,請見說明步驟"; return; }
  statusEl.textContent = "登入中...";
  const { data, error } = await db.auth.signInWithPassword({ email: usernameToEmail(uname), password: pwd });
  if(error){ statusEl.textContent = "登入失敗:" + error.message; return; }
  currentUser = { id: data.user.id, username: uname };
  await loadOrCreateProgress();
  enterApp();
});

document.getElementById("btn-logout").addEventListener("click", async () => {
  if(db) await db.auth.signOut();
  currentUser = null; state = null;
  document.getElementById("main-app").classList.add("hidden");
  document.getElementById("login-modal").classList.remove("hidden");
});

async function loadOrCreateProgress(){
  const { data, error } = await db.from('progress').select('*').eq('id', currentUser.id).maybeSingle();
  if(error){ console.error(error); state = defaultState(); return; }
  if(!data){
    state = defaultState();
    await db.from('progress').insert([{ id: currentUser.id, xp:0, streak:1, last_login: todayStr(),
      max_unlocked_unit:1, word_state:{}, wrong_buffer:[] }]);
    return;
  }
  state = {
    xp: data.xp||0, streak: data.streak||1, lastLogin: data.last_login||todayStr(),
    maxUnlockedUnit: data.max_unlocked_unit||1, wordState: data.word_state||{}, wrongBuffer: data.wrong_buffer||[]
  };
  // 每日登入判斷連續天數
  const today = todayStr();
  if(state.lastLogin !== today){
    const yesterday = addDays(today, -1);
    state.streak = (state.lastLogin === yesterday) ? state.streak + 1 : 1;
    state.lastLogin = today;
    await saveProgress();
  }
}

let saveTimer = null;
async function saveProgress(){
  if(!db || !currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await db.from('progress').update({
      xp: state.xp, streak: state.streak, last_login: state.lastLogin,
      max_unlocked_unit: state.maxUnlockedUnit, word_state: state.wordState, wrong_buffer: state.wrongBuffer
    }).eq('id', currentUser.id);
  }, 400);
}

function enterApp(){
  document.getElementById("login-modal").classList.add("hidden");
  document.getElementById("main-app").classList.remove("hidden");
  document.getElementById("lbl-username").textContent = currentUser.username;
  document.getElementById("lbl-streak").textContent = state.streak;
  document.getElementById("lbl-xp").textContent = state.xp;
  document.getElementById("unit-dropdown").value = state.maxUnlockedUnit;
  document.getElementById("unit-dropdown").onchange = (e) => {
    const v = parseInt(e.target.value);
    if(v > state.maxUnlockedUnit){ alert("🔒 尚未解鎖此單元"); e.target.value = currentUnit; return; }
    loadStage(v, 1);
  };
  document.querySelectorAll(".stage-dot").forEach(dot=>{
    dot.onclick = () => loadStage(currentUnit, parseInt(dot.dataset.stage));
  });
  loadStage(state.maxUnlockedUnit, 1);
}

/*************************************************************
 * 4. 間隔複習排程(簡化版 Leitner,box 0~5,對應 0/1/2/4/7/15 天)
 *************************************************************/
const BOX_INTERVALS = [0,1,2,4,7,15];
function getWordEntry(text){
  if(!state.wordState[text]) state.wordState[text] = { box:0, due: todayStr(), wrongCount:0, needsApplication:false };
  return state.wordState[text];
}
function isDue(text){ return getWordEntry(text).due <= todayStr(); }

/*************************************************************
 * 5. 流程控制
 *************************************************************/
let currentUnit = 1, currentStage = 1;
let queue = [], qIndex = 0, roundCorrect = 0, answered = false;
let hearts = 5;
const SESSION_CAP = 15;
let sessionApplicationWords = []; // 本次單字複習中「答對但較慢/答錯」的字,帶到語法練習當應用題
let recognitionObj = null, micTimer = null;

function loadStage(unit, stage){
  stopMic();
  currentUnit = unit; currentStage = stage; qIndex = 0; roundCorrect = 0; answered = false; hearts = 5;
  document.getElementById("unit-dropdown").value = unit;
  document.querySelectorAll(".stage-dot").forEach(d=> d.className = "stage-dot" + (parseInt(d.dataset.stage)===stage ? " active":""));
  document.getElementById("btn-manual-pass").classList.add("hidden");
  document.getElementById("btn-pause-mic").classList.add("hidden");
  const modeBadge = document.getElementById("lbl-mode");
  const heartsBox = document.getElementById("hearts-box");
  if(stage === 1){ modeBadge.textContent = "單字複習"; modeBadge.className = "mode-badge mode-vocab"; heartsBox.classList.add("hidden"); }
  else if(stage === 2){ modeBadge.textContent = "語法練習"; modeBadge.className = "mode-badge mode-grammar"; heartsBox.classList.add("hidden"); }
  else { modeBadge.textContent = "對話開口練習"; modeBadge.className = "mode-badge mode-dialogue"; heartsBox.classList.remove("hidden"); renderHearts(); }

  if(stage === 1) buildVocabQueue();
  else if(stage === 2) buildGrammarQueue();
  else buildDialogueQueue();

  showQuestion();
}

function renderHearts(){
  const box = document.getElementById("hearts-box"); box.innerHTML = "";
  for(let i=0;i<5;i++){ const h=document.createElement("i"); h.className = i<hearts ? "fa-solid fa-heart":"fa-regular fa-heart"; box.appendChild(h); }
}

// ---- 階段一:單字間隔複習 ----
function buildVocabQueue(){
  sessionApplicationWords = [];
  const pool = cumulativeVocab(currentUnit);
  const due = pool.filter(w => isDue(w.text));
  queue = shuffle(due).slice(0, SESSION_CAP);
  if(queue.length === 0) queue = shuffle(pool).slice(0, Math.min(5, pool.length)); // 全部不到期時,仍給少量練習避免空白
}

// ---- 階段二:語法練習(含單字應用層) ----
function buildGrammarQueue(){
  const pool = cumulativeVocab(currentUnit);
  const base = shuffle(pool.filter(w=>w.unit===currentUnit && !w.isQuantifier)).slice(0,3);
  const applicationWords = sessionApplicationWords.slice(0,4).map(w => pool.find(p=>p.text===w)).filter(Boolean);
  const combined = [...new Set([...base, ...applicationWords])];
  if(combined.length === 0) combined.push(...shuffle(pool).slice(0,3));
  queue = combined.map(w => ({ word:w, ...buildSentenceFor(w, currentUnit) }));
}

// ---- 階段三:對話與刻意練習 ----
function buildDialogueQueue(){
  const meta = UNIT_META[currentUnit];
  const dialogueItems = meta.dialogue.map(line => ({ type:'dialogue', kr: line.kr, chinese: line.zh, speaker: line.spk }));
  const pool = cumulativeVocab(currentUnit);
  const extra = shuffle(pool).slice(0,4).map(w => ({ type:'shadow', ...buildSentenceFor(w, w.unit) }));
  queue = shuffle([...dialogueItems, ...extra]);
}

/*************************************************************
 * 6. 出題渲染
 *************************************************************/
function showQuestion(){
  if(qIndex >= queue.length){ handleStageComplete(); return; }
  answered = false;
  document.getElementById("quiz-options").classList.add("hidden");
  document.getElementById("puzzle-selected").classList.add("hidden");
  document.getElementById("puzzle-pool").classList.add("hidden");
  document.getElementById("btn-manual-pass").classList.add("hidden");
  document.getElementById("btn-pause-mic").classList.add("hidden");
  document.getElementById("lbl-status").textContent = "";
  document.getElementById("lbl-status").className = "status-msg";
  document.getElementById("main-progress").style.width = Math.round((qIndex/queue.length)*100) + "%";

  if(currentStage === 1) renderVocabQuestion();
  else if(currentStage === 2) renderGrammarQuestion();
  else renderDialogueQuestion();
}

let qStartTime = 0;
function renderVocabQuestion(){
  const w = queue[qIndex];
  document.getElementById("lbl-sub").textContent = "辨識層:選出正確意思";
  document.getElementById("lbl-target").textContent = w.text;
  document.getElementById("quiz-options").classList.remove("hidden");
  playTTS(w.text);
  const pool = cumulativeVocab(currentUnit).filter(x=>x.text!==w.text);
  const opts = shuffle([w, ...shuffle(pool).slice(0,3)]);
  const container = document.getElementById("quiz-options");
  container.innerHTML = "";
  qStartTime = Date.now();
  opts.forEach(o=>{
    const btn = document.createElement("button");
    btn.className = "option-btn"; btn.textContent = o.chinese;
    btn.onclick = () => handleVocabAnswer(o.text === w.text, w);
    container.appendChild(btn);
  });
}

function handleVocabAnswer(correct, w){
  if(answered) return; answered = true;
  const elapsed = (Date.now() - qStartTime) / 1000;
  const entry = getWordEntry(w.text);
  if(correct){
    const fast = elapsed < 3;
    entry.box = Math.min(5, entry.box + (fast ? 2 : 1));
    entry.wrongCount = 0;
    if(!fast){ entry.needsApplication = true; sessionApplicationWords.push(w.text); }
    entry.due = addDays(todayStr(), BOX_INTERVALS[entry.box]);
    state.xp += fast ? 15 : 10;
    document.getElementById("lbl-status").innerHTML = fast
      ? '<span style="color:var(--success)"><i class="fa-solid fa-bolt"></i> 反應快,直接記住了!+15 XP</span>'
      : '<span style="color:var(--success)"><i class="fa-solid fa-check"></i> 答對,稍後語法練習會再應用一次,+10 XP</span>';
  } else {
    entry.box = 0; entry.wrongCount = (entry.wrongCount||0) + 1; entry.needsApplication = true;
    sessionApplicationWords.push(w.text);
    entry.due = todayStr();
    document.getElementById("lbl-status").innerHTML = '<span style="color:var(--danger)"><i class="fa-solid fa-x"></i> 答錯了,明天會再出現,語法練習也會加強這個字</span>';
  }
  document.getElementById("lbl-xp").textContent = state.xp;
  saveProgress();
  setTimeout(()=>{ qIndex++; showQuestion(); }, 1000);
}

function renderGrammarQuestion(){
  const item = queue[qIndex];
  document.getElementById("lbl-sub").textContent = "聽音並拖曳字塊組成正確句子";
  document.getElementById("lbl-target").textContent = `🎵 ${item.chinese}`;
  playTTS(item.sentence);
  const poolZone = document.getElementById("puzzle-pool");
  const selZone = document.getElementById("puzzle-selected");
  poolZone.classList.remove("hidden"); selZone.classList.remove("hidden");
  poolZone.innerHTML = ""; selZone.innerHTML = "";
  const distractors = ["이","가","있어요.","주세요.","개","명"];
  let blocks = [...item.blocks];
  distractors.forEach(d=>{ if(!blocks.includes(d) && blocks.length < item.blocks.length + 2) blocks.push(d); });
  blocks = shuffle(blocks);
  let selected = [];
  function renderSelected(){
    selZone.innerHTML = "";
    selected.forEach((b,i)=>{
      const el = document.createElement("div"); el.className="word-block"; el.textContent=b.text;
      el.onclick = () => { if(answered) return; b.el.classList.remove("used"); selected = selected.filter(x=>x!==b); renderSelected(); };
      selZone.appendChild(el);
    });
    const current = selected.map(b=>b.text).join("").replace(/[.\s]/g,"");
    const target = item.sentence.replace(/[.\s]/g,"");
    if(current === target) handleGrammarAnswer(true, item);
    else if(selected.length >= item.blocks.length) handleGrammarAnswer(false, item);
  }
  blocks.forEach(b=>{
    const el = document.createElement("div"); el.className="word-block"; el.textContent=b;
    el.onclick = () => {
      if(answered || el.classList.contains("used")) return;
      el.classList.add("used"); const entry = {text:b, el}; selected.push(entry); renderSelected();
    };
    poolZone.appendChild(el);
  });
}

function handleGrammarAnswer(correct, item){
  if(answered) return; answered = true;
  if(correct){
    state.xp += 12;
    document.getElementById("lbl-status").innerHTML = '<span style="color:var(--success)"><i class="fa-solid fa-check"></i> 句子組對了!+12 XP</span>';
    if(item.word){ getWordEntry(item.word.text).needsApplication = false; }
  } else {
    document.getElementById("lbl-status").innerHTML = `<span style="color:var(--danger)">再看一次正確句子:${item.sentence}</span>`;
  }
  document.getElementById("lbl-xp").textContent = state.xp;
  saveProgress();
  setTimeout(()=>{ qIndex++; showQuestion(); }, 1400);
}

function renderDialogueQuestion(){
  const item = queue[qIndex];
  document.getElementById("btn-manual-pass").classList.add("hidden");
  if(item.type === 'dialogue'){
    document.getElementById("lbl-sub").textContent = item.speaker === 'B' ? "換你開口說這句" : "先聽對方說什麼";
    document.getElementById("lbl-target").textContent = `${item.speaker}:${item.chinese}`;
    playTTS(item.kr);
    if(item.speaker === 'B'){
      setTimeout(()=> startSpeechCheck(item.kr, item), 1200);
    } else {
      setTimeout(()=>{ qIndex++; showQuestion(); }, 1600);
    }
  } else {
    document.getElementById("lbl-sub").textContent = "盲聽跟讀挑戰";
    document.getElementById("lbl-target").textContent = `🔊 ${item.chinese}`;
    playTTS(item.sentence);
    setTimeout(()=> startSpeechCheck(item.sentence, item), 1400);
  }
}

function handleDialogueResult(correct, item){
  if(answered) return; answered = true;
  roundCorrect += correct ? 1 : 0;
  if(correct){
    state.xp += 15;
    document.getElementById("lbl-status").innerHTML = '<span style="color:var(--success)"><i class="fa-solid fa-check"></i> 發音辨識通過!+15 XP</span>';
  } else {
    hearts = Math.max(0, hearts-1); renderHearts();
    document.getElementById("lbl-status").innerHTML = '<span style="color:var(--danger)">再練一次,沒關係,馬上進下一句</span>';
  }
  document.getElementById("lbl-xp").textContent = state.xp;
  saveProgress();
  setTimeout(()=>{ qIndex++; showQuestion(); }, 1300);
}

function handleStageComplete(){
  document.getElementById("main-progress").style.width = "100%";
  if(currentStage === 1){
    alert("✅ 本次單字複習完成,進入語法練習!");
    loadStage(currentUnit, 2);
  } else if(currentStage === 2){
    alert("✅ 語法練習完成,進入對話開口練習!");
    loadStage(currentUnit, 3);
  } else {
    if(roundCorrect >= Math.ceil(queue.length * 0.6)){
      alert("🏆 本單元完成!" + (currentUnit < 3 ? "解鎖下一單元!" : "已完成全部單元示範內容!"));
      if(state.maxUnlockedUnit === currentUnit && currentUnit < 3) state.maxUnlockedUnit = currentUnit + 1;
      saveProgress();
      loadStage(Math.min(currentUnit + 1, 3), 1);
    } else {
      alert("💪 開口通過率還可以再高一點,我們重新複習一次這個單元的對話!");
      loadStage(currentUnit, 3);
    }
  }
}

/*************************************************************
 * 7. 語音:TTS 播放 + STT 辨識(bigram 相似度,失敗走手動確認)
 *************************************************************/
function playTTS(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'ko-KR'; u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
document.getElementById("btn-tts").addEventListener("click", ()=>{
  const item = queue[qIndex]; if(!item) return;
  playTTS(item.text || item.kr || item.sentence);
});

function startSpeechCheck(targetText, item){
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const manualBtn = document.getElementById("btn-manual-pass");
  const statusEl = document.getElementById("lbl-status");
  manualBtn.onclick = () => { stopMic(); handleDialogueResult(true, item); };

  if(!Recognition){
    statusEl.innerHTML = '<span style="color:var(--warning)">此瀏覽器不支援語音辨識,請用下方按鈕手動確認</span>';
    manualBtn.classList.remove("hidden");
    return;
  }
  recognitionObj = new Recognition();
  recognitionObj.lang = 'ko-KR';
  recognitionObj.interimResults = false;
  statusEl.className = "status-msg listening-active";
  statusEl.innerHTML = '<i class="fa-solid fa-microphone"></i> 請說出這句話...';
  const pauseBtn = document.getElementById("btn-pause-mic");
  pauseBtn.classList.remove("hidden");
  pauseBtn.onclick = () => { stopMic(); statusEl.className="status-msg"; statusEl.textContent="已停止錄音"; manualBtn.classList.remove("hidden"); };

  micTimer = setTimeout(()=>{
    stopMic();
    statusEl.className = "status-msg";
    statusEl.innerHTML = '<span style="color:var(--warning)">沒聽到聲音,可以用下方按鈕手動確認</span>';
    manualBtn.classList.remove("hidden");
  }, 6000);

  try { recognitionObj.start(); } catch(e){ console.log(e); }

  recognitionObj.onresult = (event) => {
    clearTimeout(micTimer);
    const said = event.results[0][0].transcript;
    const sim = similarity(said, targetText);
    stopMic();
    if(sim >= 0.6){ handleDialogueResult(true, item); }
    else {
      statusEl.className = "status-msg";
      statusEl.innerHTML = `<span style="color:var(--danger)">辨識結果:「${said}」,相似度不夠,可重新錄音或手動確認</span>`;
      manualBtn.classList.remove("hidden");
    }
  };
  recognitionObj.onerror = () => {
    clearTimeout(micTimer);
    stopMic();
    statusEl.className = "status-msg";
    statusEl.innerHTML = '<span style="color:var(--warning)">語音辨識失敗(常見於行動裝置瀏覽器),請用下方按鈕手動確認</span>';
    manualBtn.classList.remove("hidden");
  };
}
function stopMic(){
  clearTimeout(micTimer);
  if(recognitionObj){ try{ recognitionObj.stop(); }catch(e){} }
  document.getElementById("btn-pause-mic").classList.add("hidden");
}
</script>

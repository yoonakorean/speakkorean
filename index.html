<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式韓語語言學習 APP</title>
    <!-- 引入 Font Awesome Icon 圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 30px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 15px;
        }

        .unit-info h2 {
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .stages-indicator {
            display: flex;
            gap: 10px;
        }

        .stage-dot {
            padding: 6px 12px;
            background: #e5e7eb;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #6b7280;
            transition: all 0.3s;
        }

        .stage-dot.active {
            background: var(--primary-color);
            color: #fff;
        }

        .stage-dot.locked {
            opacity: 0.5;
        }

        .progress-bar-container {
            width: 100%;
            background: #e5e7eb;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--success-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .card-content {
            text-align: center;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .korean-text {
            font-size: 3rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .hint-text {
            font-size: 1.1rem;
            color: #6b7280;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success-color); color: white; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-secondary { background: #e5e7eb; color: #4b5563; }
        .btn-secondary:hover { background: #d1d5db; }

        .speaking-status {
            margin-top: 15px;
            font-weight: 600;
            font-size: 1rem;
            min-height: 24px;
        }

        .status-listening { color: var(--primary-color); animation: pulse 1.5s infinite; }
        .status-success { color: var(--success-color); }
        .status-error { color: var(--danger-color); }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部資訊與關卡進度 -->
        <div class="header">
            <div class="unit-info">
                <h2 id="unit-title">單元 1</h2>
            </div>
            <div class="stages-indicator">
                <span class="stage-dot" id="dot-1"><i class="fa-solid fa-w"></i> 單字</span>
                <span class="stage-dot" id="dot-2"><i class="fa-solid fa-s"></i> 句型</span>
                <span class="stage-dot" id="dot-3"><i class="fa-solid fa-microphone"></i> 口說</span>
            </div>
        </div>

        <!-- 當前佇列題目進度條 -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- 核心題目卡片 -->
        <div class="card-content">
            <div class="korean-text" id="target-text">안녕하세요</div>
            <div class="hint-text" id="target-hint">類型：單字</div>
            <div class="speaking-status" id="speaking-status"></div>
        </div>

        <!-- 互動按鈕區 -->
        <div class="actions">
            <!-- 聽力與發音導讀 (關卡 1, 2, 3 通用) -->
            <button class="btn-secondary" id="btn-tts">
                <i class="fa-solid fa-volume-high"></i> 發音導讀
            </button>

            <!-- 關卡 1 & 2 的按鈕組 -->
            <div class="btn-group" id="normal-actions">
                <button class="btn-primary" id="btn-know">
                    <i class="fa-solid fa-check"></i> 我知道了
                </button>
            </div>

            <!-- 關卡 3 (口說) 的專用按鈕組 -->
            <div class="btn-group hidden" id="speaking-actions">
                <button class="btn-success" id="btn-mic">
                    <i class="fa-solid fa-microphone"></i> 開始口說
                </button>
                <button class="btn-secondary" id="btn-skip">
                    <i class="fa-solid fa-forward"></i> 跳過此題
                </button>
            </div>
        </div>
    </div>

    <script>
        /*************************************************************
         * 1. 資料架構與動態生成邏輯 (原 words.js 概念)
         *************************************************************/
        // 基礎原始素材
        const rawMaterials = {
            1: {
                words: ["짐", "볼펜", "담요", "휴지", "시계", "지우개", "컴퓨터", "라면", "콜라", "지갑", "커피", "메뉴", "우산"],
                sentences: [] // 由單字與 이/가 있어요/없어요 動態組裝
            },
            2: {
                words: ["하나", "둘", "셋", "넷", "다섯", "여섯", "일곱", "여덟", "아홉", "열", "손님", "정장", "맥주", "잡지", "여권", "핸드폰", "옷"],
                sentences: [] // 由固有數字與量詞動態組裝
            },
            3: {
                words: ["반찬", "홍차", "빵"],
                sentences: ["반찬 주세요", "홍차 주세요", "빵 주세요"]
            }
        };

        // 韓文收音判斷（用於單元一的 이/가）
        function hasBatchim(word) {
            const lastChar = word.charCodeAt(word.length - 1);
            if (lastChar < 0xAC00 || lastChar > 0xD7A3) return false; // 非韓文
            return (lastChar - 0xAC00) % 28 !== 0;
        }

        // 固有數字變體轉換（用於量詞前）
        function getNumAttr(numStr) {
            const mapping = {
                "하나": "한", "둘": "두", "셋": "세", "넷": "네", "다섯": "다섯",
                "여섯": "여섯", "일곱": "일곱", "여덟": "여덟", "아홉": "아홉", "열": "열"
            };
            return mapping[numStr] || numStr;
        }

        // 動態初始化題庫總庫
        function generateDatabase() {
            let db = [];
            let idCounter = 1;

            // --- 單元一 生成 ---
            rawMaterials[1].words.forEach(w => {
                db.push({ id: idCounter++, unit: 1, type: 'word', text: w, learned: false, isFluent: false });
                // 隨機組裝 이/가 있어요 / 없어요
                const particle = hasBatchim(w) ? "이" : "가";
                db.push({ id: idCounter++, unit: 1, type: 'sentence', text: `${w}${particle} 있어요`, learned: false, isFluent: false });
                db.push({ id: idCounter++, unit: 1, type: 'sentence', text: `${w}${particle} 없어요`, learned: false, isFluent: false });
            });

            // --- 單元二 生成 ---
            rawMaterials[2].words.forEach(w => {
                db.push({ id: idCounter++, unit: 2, type: 'word', text: w, learned: false, isFluent: false });
            });
            // 隨機排列組合固有數字練習
            const unit2Nouns = ["손님", "정장", "맥주", "잡지", "여권", "핸드폰", "옷", "커피", "콜라", "라면"];
            const counters = ["개", "명", "잔", "벌", "병", "마리", "조각", "권", "대", "켤레"];
            const numbers = ["하나", "둘", "셋", "넷", "다섯", "여섯", "일곱", "여덟", "아홉", "열"];
            
            // 產生一些隨機合理的量詞組合填入句型庫
            for(let i=0; i<20; i++) {
                const randNoun = unit2Nouns[Math.floor(Math.random() * unit2Nouns.length)];
                const randNum = numbers[Math.floor(Math.random() * numbers.length)];
                const randCounter = counters[Math.floor(Math.random() * counters.length)];
                const combinedText = `${randNoun} ${getNumAttr(randNum)} ${randCounter}`;
                db.push({ id: idCounter++, unit: 2, type: 'sentence', text: combinedText, learned: false, isFluent: false });
            }

            // --- 單元三 生成 ---
            rawMaterials[3].words.forEach(w => {
                db.push({ id: idCounter++, unit: 3, type: 'word', text: w, learned: false, isFluent: false });
            });
            rawMaterials[3].sentences.forEach(s => {
                db.push({ id: idCounter++, unit: 3, type: 'sentence', text: s, learned: false, isFluent: false });
            });

            return db;
        }

        /*************************************************************
         * 2. 狀態管理 (LocalStorage 持久化)
         *************************************************************/
        const STORAGE_KEY_DB = "KR_LEARN_DB_2026";
        const STORAGE_KEY_PROGRESS = "KR_LEARN_PROG_2026";

        let wordsDatabase = [];
        let userProgress = {
            currentUnit: 1,
            currentStage: 1 // 1: Word, 2: Sentence, 3: Speaking
        };

        function loadState() {
            const savedDB = localStorage.getItem(STORAGE_KEY_DB);
            const savedProg = localStorage.getItem(STORAGE_KEY_PROGRESS);
            if (savedDB && savedProg) {
                wordsDatabase = JSON.parse(savedDB);
                userProgress = JSON.parse(savedProg);
            } else {
                wordsDatabase = generateDatabase();
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY_DB, JSON.stringify(wordsDatabase));
            localStorage.setItem(STORAGE_KEY_PROGRESS, JSON.stringify(userProgress));
        }

        /*************************************************************
         * 3. 核心演算法 (間隔重複比例混入 & Fisher-Yates 洗牌)
         *************************************************************/
        const TOTAL_QUESTIONS = 10; // T = 10 每輪練習十題

        // Fisher-Yates 洗牌演算法
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[i Flyweights], array[j], array[i]] = [array[j], array[i]]; // 更正結構賦值語法
            }
            // 修正上方小手誤：
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const temp = array[i];
                array[i] = array[j];
                array[j] = temp;
            }
            return array;
        }

        // 動態生成關卡題庫佇列 (70% 新內容, 30% 歷史不熟)
        function generateQuizQueue(unit, stageType) {
            // 映射 stageType: 1&3 都用到題目的基礎池。1為word，2、3皆為sentence
            const itemType = (stageType === 1) ? 'word' : 'sentence';

            // 1. 篩選全池子
            const newPool = wordsDatabase.filter(item => item.unit === unit && item.type === itemType && !item.learned);
            const historyPool = wordsDatabase.filter(item => item.unit < unit && item.type === itemType && !item.isFluent);

            let newTargetCount = Math.round(TOTAL_QUESTIONS * 0.7); // 7 題
            let histTargetCount = TOTAL_QUESTIONS - newTargetCount;  // 3 題

            let selectedNew = [];
            let selectedHist = [];

            // 2. 抽取歷史不熟材料
            shuffle(historyPool);
            selectedHist = historyPool.slice(0, histTargetCount);

            // 例外安全處理：如果歷史不熟不足 30%
            if (selectedHist.length < histTargetCount) {
                newTargetCount += (histTargetCount - selectedHist.length);
            }

            // 3. 抽取新材料
            shuffle(newPool);
            selectedNew = newPool.slice(0, newTargetCount);

            // 例外安全處理：如果新內容仍不足補滿總數 T，反向從歷史池或已學池撈取
            let combined = [...selectedNew, ...selectedHist];
            if (combined.length < TOTAL_QUESTIONS) {
                const backupPool = wordsDatabase.filter(item => item.type === itemType && !combined.includes(item));
                shuffle(backupPool);
                const needed = TOTAL_QUESTIONS - combined.length;
                combined = combined.concat(backupPool.slice(0, needed));
            }

            // 最終打亂大洗牌
            return shuffle(combined.slice(0, TOTAL_QUESTIONS));
        }

        /*************************************************************
         * 4. 語音技術與判定 (TTS 與 Web Speech API)
         *************************************************************/
        // TTS 發音導讀
        function playTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止之前的聲音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                window.speechSynthesis.speak(utterance);
            } else {
                alert("您的瀏覽器不支援 TTS 語音播放功能。");
            }
        }

        // Web Speech API 語音辨識初始化
        let recognition = null;
        if ('webkitSpeechRecognition' in window || 'speechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR'; // 嚴格設定為韓語語系
            recognition.continuous = false;
            recognition.interimResults = false;
        }

        // 標點符號清除與小寫正規化處理
        function cleanText(str) {
            return str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?\s]/g, "").toLowerCase();
        }

        /*************************************************************
         * 5. 關卡驅動主控制與 UI 渲染
         *************************************************************/
        let currentQueue = [];
        let currentIndex = 0;

        const elUnitTitle = document.getElementById("unit-title");
        const elTargetText = document.getElementById("target-text");
        const elTargetHint = document.getElementById("target-hint");
        const elProgressBar = document.getElementById("progress-bar");
        const elSpeakingStatus = document.getElementById("speaking-status");

        const elNormalActions = document.getElementById("normal-actions");
        const elSpeakingActions = document.getElementById("speaking-actions");

        const elBtnTTS = document.getElementById("btn-tts");
        const elBtnKnow = document.getElementById("btn-know");
        const elBtnMic = document.getElementById("btn-mic");
        const elBtnSkip = document.getElementById("btn-skip");

        function initApp() {
            loadState();
            startStage();
        }

        function startStage() {
            // 超出最大單元防呆
            if (userProgress.currentUnit > 3) {
                alert("恭喜！您已通關目前所有的韓語單元！系統將為您重置回第一單元。");
                userProgress.currentUnit = 1;
                userProgress.currentStage = 1;
                wordsDatabase = generateDatabase();
                saveState();
            }

            // 更新 UI 頂部標示
            elUnitTitle.innerText = `單元 ${userProgress.currentUnit}`;
            document.querySelectorAll(".stage-dot").forEach((dot, index) => {
                dot.classList.remove("active");
                if (index + 1 === userProgress.currentStage) {
                    dot.classList.add("active");
                }
            });

            // 依據關卡切換操作面板
            if (userProgress.currentStage === 3) {
                elNormalActions.classList.add("hidden");
                elSpeakingActions.classList.remove("hidden");
            } else {
                elNormalActions.classList.remove("hidden");
                elSpeakingActions.classList.add("hidden");
            }

            elSpeakingStatus.className = "speaking-status";
            elSpeakingStatus.innerText = "";

            // 生成當前關卡題庫佇列
            currentQueue = generateQuizQueue(userProgress.currentUnit, userProgress.currentStage);
            currentIndex = 0;
            renderCard();
        }

        function renderCard() {
            if (currentIndex >= currentQueue.length) {
                nextStageDriver();
                return;
            }

            const currentItem = currentQueue[currentIndex];
            elTargetText.innerText = currentItem.text;
            
            // 顯示提示標籤
            let typeLabel = currentItem.type === 'word' ? '單字' : '句型';
            let historyLabel = currentItem.unit < userProgress.currentUnit ? ' (歷史複習)' : '';
            elTargetHint.innerText = `類型：${typeLabel}${historyLabel}`;

            // 更新進度條
            const percentage = (currentIndex / currentQueue.length) * 100;
            elProgressBar.style.width = `${percentage}%`;
            
            elSpeakingStatus.className = "speaking-status";
            elSpeakingStatus.innerText = "";
        }

        // 關卡進階流程驅動器
        function nextStageDriver() {
            elProgressBar.style.width = "100%";
            if (userProgress.currentStage === 1) {
                alert("🎉 單字背誦關卡完成！即將解鎖進入【句型練習】。");
                userProgress.currentStage = 2;
            } else if (userProgress.currentStage === 2) {
                alert("🎉 句型練習關卡完成！即將解鎖進入【口說跟讀】。");
                userProgress.currentStage = 3;
            } else if (userProgress.currentStage === 3) {
                alert("🏆 太棒了！口說關卡全數通過！恭喜晉級下一個單元！");
                userProgress.currentUnit++;
                userProgress.currentStage = 1; // 重置回單字關卡
            }
            saveState();
            startStage();
        }

        // 更新資料庫狀態
        function updateItemStatus(item, isCorrect) {
            const dbItem = wordsDatabase.find(d => d.id === item.id);
            if (dbItem) {
                if (userProgress.currentStage === 1 || userProgress.currentStage === 2) {
                    dbItem.learned = true;
                } else if (userProgress.currentStage === 3 && isCorrect) {
                    dbItem.isFluent = true;
                }
                saveState();
            }
        }

        /*************************************************************
         * 6. 事件監聽設定
         *************************************************************/
        // 發音導讀按鈕
        elBtnTTS.addEventListener("click", () => {
            const currentItem = currentQueue[currentIndex];
            if (currentItem) playTTS(currentItem.text);
        });

        // 關卡 1 & 2「我知道了」按鈕
        elBtnKnow.addEventListener("click", () => {
            const currentItem = currentQueue[currentIndex];
            updateItemStatus(currentItem, true);
            currentIndex++;
            renderCard();
        });

        // 關卡 3「開始口說」辨識監聽
        if (recognition) {
            elBtnMic.addEventListener("click", () => {
                elSpeakingStatus.className = "speaking-status status-listening";
                elSpeakingStatus.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 正在聆聽您的發音...`;
                recognition.start();
            });

            recognition.onresult = function(event) {
                const userSpeech = event.results[0][0].transcript;
                const currentItem = currentQueue[currentIndex];
                
                const cleanedUser = cleanText(userSpeech);
                const cleanedTarget = cleanText(currentItem.text);

                console.log(`識別結果: ${userSpeech} (處理後: ${cleanedUser})`);
                console.log(`正確目標: ${currentItem.text} (處理後: ${cleanedTarget})`);

                // 字串完全比對判定
                if (cleanedUser === cleanedTarget) {
                    elSpeakingStatus.className = "speaking-status status-success";
                    elSpeakingStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 答對了！辨識結果："${userSpeech}"`;
                    
                    updateItemStatus(currentItem, true);
                    // 答對延遲一秒自動進入下一題
                    setTimeout(() => {
                        currentIndex++;
                        renderCard();
                    }, 1200);
                } else {
                    elSpeakingStatus.className = "speaking-status status-error";
                    elSpeakingStatus.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> 唸錯囉，請再試一次。辨識結果："${userSpeech}"`;
                }
            };

            recognition.onerror = function(event) {
                elSpeakingStatus.className = "speaking-status status-error";
                elSpeakingStatus.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 語音辨識出錯 (${event.error})，請再試一次。`;
            };
        } else {
            elBtnMic.addEventListener("click", () => {
                alert("很抱歉，您的瀏覽器不支援 Web Speech API 語音辨識（建議使用 Google Chrome 瀏覽器）。");
            });
        }

        // 關卡 3「跳過此題」按鈕
        elBtnSkip.addEventListener("click", () => {
            const currentItem = currentQueue[currentIndex];
            updateItemStatus(currentItem, false); // 未過關，不更新 isFluent
            currentIndex++;
            renderCard();
        });

        // 啟動應用程式
        window.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
